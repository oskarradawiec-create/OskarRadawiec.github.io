{% extends "layout.html" %}
{% block title %}{{ book.title }}{% endblock %}
{% block content %}
    <h1>{{ book.title }}</h1>
    <article>
        <p><strong>Author:</strong> {{ book.author }}</p>
        <p><strong>Year:</strong> {{ book.year }}</p>
    </article>
    <ul class="action-list">
        <li><a href="{{ url_for('book.book_index') }}">Back to list</a></li>
        <li><a href="{{ url_for('book.edit_book', id=book.id) }}">Edit</a></li>
    </ul>
{% endblock %}
