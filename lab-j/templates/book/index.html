{% extends "layout.html" %}
{% block title %}Book List{% endblock %}
{% block content %}
    <h1>Books List</h1>
    <a href="{{ url_for('book.create_book') }}">Create new</a>
    <ul class="index-list">
        {% for book in books %}
            <li>
                <h3>{{ book.title }}</h3>
                <ul class="action-list">
                    <li><a href="{{ url_for('book.show_book', id=book.id) }}">Details</a></li>
                    <li><a href="{{ url_for('book.edit_book', id=book.id) }}">Edit</a></li>
                </ul>
            </li>
        {% endfor %}
    </ul>
{% endblock %}
