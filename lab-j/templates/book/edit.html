{% extends "layout.html" %}
{% block title %}Edit Book {{ book.title }}{% endblock %}
{% block content %}
    <h1>Edit Book {{ book.title }} ({{ book.id }})</h1>
    <form action="{{ url_for('book.edit_book', id=book.id) }}" method="post" class="edit-form">
        {% include 'book/_form.html' %}
    </form>
    <ul class="action-list">
        <li><a href="{{ url_for('book.book_index') }}">Back to list</a></li>
        <li>
            <form action="{{ url_for('book.delete_book', id=book.id) }}" method="post">
                <input type="submit" value="Delete" onclick="return confirm('Are you sure?')">
            </form>
        </li>
    </ul>
{% endblock %}
