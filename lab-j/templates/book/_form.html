<div class="form-group">
    <label for="title">Title</label>
    <input type="text" id="title" name="title" value="{{ book.title if book else '' }}">
</div>

<div class="form-group">
    <label for="author">Author</label>
    <input type="text" id="author" name="author" value="{{ book.author if book else '' }}">
</div>

<div class="form-group">
    <label for="year">Year</label>
    <input type="number" id="year" name="year" value="{{ book.year if book else '' }}">
</div>

<div class="form-group">
    <input type="submit" value="Submit">
</div>
